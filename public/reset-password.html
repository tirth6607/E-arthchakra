<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password — E-arthchakra</title>

    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="logo.png">

    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/svg+xml" href="brand-mark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="brand.css">
</head>


<body class="login-page">

<header class="login-header">
    <div class="container">
        <a href="index.html" class="logo"><span class="brand"><img src="brand-mark.svg" alt="" width="38" height="38"><span class="brand-word"><b>E</b>-arth<i>chakra</i></span></span></a>
    </div>
</header>


<main class="login-main">

    <div class="login-container">

        <!-- STEP: NEW PASSWORD -->

        <div class="login-card" id="resetCard">

            <div class="login-card-header">
                <h2>Create New Password</h2>
                <p>Choose a new password for your account. Use at least 8 characters.</p>
            </div>

            <form id="resetForm" novalidate>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-input">
                        <input
                            type="password"
                            id="newPassword"
                            placeholder="At least 8 characters"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="toggle-password" data-target="newPassword" aria-label="Show password">Show</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="password-input">
                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Re-enter your new password"
                            autocomplete="new-password"
                            required
                        >
                        <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password">Show</button>
                    </div>
                </div>

                <div class="login-error" id="resetError"></div>

                <button type="submit" class="btn btn-primary btn-large login-submit">
                    Reset Password
                    <span>→</span>
                </button>

            </form>

        </div>


        <!-- STEP: SUCCESS -->

        <div class="login-card" id="successCard" hidden>

            <div class="login-card-header">
                <h2>Password Reset Successful</h2>
                <p>Your password has been changed successfully.</p>
            </div>

            <a href="login.html" class="btn btn-primary btn-large login-submit">
                Login
                <span>→</span>
            </a>

        </div>

    </div>

</main>


<script src="api.js"></script>

<script>

const resetToken = sessionStorage.getItem("earthchakra_reset_token");
if (!resetToken) window.location.replace("forgot-password.html");

const resetForm = document.getElementById("resetForm");
const resetError = document.getElementById("resetError");
const resetSubmit = resetForm.querySelector('button[type="submit"]');

function showError(message) {
    resetError.textContent = message;
    resetError.classList.add("show");
}

document.querySelectorAll(".toggle-password").forEach((button) => {
    button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);
        const hidden = input.type === "password";
        input.type = hidden ? "text" : "password";
        button.textContent = hidden ? "Hide" : "Show";
        button.setAttribute("aria-label", hidden ? "Hide password" : "Show password");
    });
});

resetForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword.length < 8) {
        return showError("Password does not meet the required security requirements. Use at least 8 characters.");
    }
    if (newPassword !== confirmPassword) return showError("Passwords do not match.");

    resetSubmit.disabled = true;

    try {
        await EcoAPI.call("/auth/reset-password", { method: "POST", body: { resetToken, newPassword } });

        sessionStorage.removeItem("earthchakra_reset_token");
        sessionStorage.removeItem("earthchakra_reset_email");
        localStorage.removeItem("earthchakra_user"); // old sessions were signed out on the server

        document.getElementById("resetCard").hidden = true;
        document.getElementById("successCard").hidden = false;

    } catch (error) {
        showError(error.message);
        resetSubmit.disabled = false;

        // Expired or used token: the user has to start again.
        if (/start again/i.test(error.message)) sessionStorage.removeItem("earthchakra_reset_token");
    }
});

</script>

</body>

</html>
