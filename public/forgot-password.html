<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password — E-arthchakra</title>

    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="logo.png">

    <meta name="description" content="Reset the password of your E-arthchakra account.">

    <link rel="stylesheet" href="style.css">

    <link rel="icon" type="image/svg+xml" href="brand-mark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="brand.css">
</head>


<body class="login-page">

<header class="login-header">
    <div class="container">
        <a href="index.html" class="logo"><span class="brand"><img src="brand-mark.svg" alt="" width="38" height="38"><span class="brand-word"><b>E</b>-arth<i>chakra</i></span></span></a>
    </div>
</header>


<main class="login-main">

    <div class="login-container">

        <div class="login-card">

            <div class="login-card-header">
                <h2>Forgot Password?</h2>
                <p>Enter your registered email address and we'll send you a verification code.</p>
            </div>

            <form id="forgotForm" novalidate>

                <div class="form-group">
                    <label for="resetEmail">Email</label>
                    <input
                        type="email"
                        id="resetEmail"
                        placeholder="you@company.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="login-error" id="forgotError"></div>

                <button type="submit" class="btn btn-primary btn-large login-submit">
                    Send Code
                    <span>→</span>
                </button>

            </form>

        </div>

        <a href="login.html" class="login-back">← Back to Login</a>

    </div>

</main>


<script src="api.js"></script>

<script>

const forgotForm = document.getElementById("forgotForm");
const forgotError = document.getElementById("forgotError");
const forgotSubmit = forgotForm.querySelector('button[type="submit"]');
const emailInput = document.getElementById("resetEmail");

emailInput.value = sessionStorage.getItem("earthchakra_reset_email") || "";

function showError(message) {
    forgotError.textContent = message;
    forgotError.classList.add("show");
}

forgotForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    const email = emailInput.value.trim().toLowerCase();

    if (!email) return showError("Please enter your email address.");
    if (!/^\S+@\S+\.\S+$/.test(email)) return showError("Please enter a valid email address.");

    forgotSubmit.disabled = true;

    try {
        const { message } = await EcoAPI.call("/auth/forgot-password", { method: "POST", body: { email } });

        sessionStorage.setItem("earthchakra_reset_email", email);
        sessionStorage.setItem("earthchakra_reset_notice", message);
        sessionStorage.setItem("earthchakra_reset_sent_at", String(Date.now()));

        window.location.href = "verify-reset-code.html";

    } catch (error) {
        showError(error.message);
        forgotSubmit.disabled = false;
    }
});

</script>

</body>

</html>
