<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — E-arthchakra</title>
<meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
<style>
:root{--g9:#0d2b1b;--g8:#123b25;--g6:#21713d;--g5:#2d8a4d;--g4:#4caf68;--g1:#e7f3e9;--ink:#142018;--mu:#6b786f;--bd:#e6ece7}
body.d{background:#f2f6f2;color:var(--ink);min-height:100vh}
.d *{box-sizing:border-box}
.d-nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}
.d-nav>div{max-width:1200px;margin:auto;padding:0 24px;height:70px;display:flex;align-items:center;justify-content:space-between}
.d-links{display:flex;gap:28px;font-size:.88rem;font-weight:600;color:var(--mu)}.d-links a:hover{color:var(--g6)}
.d-me{position:relative}
.d-me>button{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border:1px solid var(--bd);border-radius:99px;background:#fff;cursor:pointer;transition:.2s}
.d-me>button:hover{box-shadow:0 6px 18px rgba(13,43,27,.1)}
.d-av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--g5),var(--g8));color:#fff;font-size:.8rem;font-weight:800;flex:none}
.d-nm{font-size:.82rem;font-weight:700;text-align:left;line-height:1.25;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-nm small{display:block;color:var(--mu);font-weight:500;font-size:.7rem}
.d-pop{display:none;position:absolute;right:0;top:calc(100% + 12px);width:320px;background:#fff;border:1px solid var(--bd);border-radius:18px;box-shadow:0 24px 60px rgba(13,43,27,.18);overflow:hidden}
.d-pop.open{display:block;animation:pop .18s ease}@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.d-ph{padding:22px;background:linear-gradient(150deg,var(--g8),var(--g9));color:#fff;display:flex;gap:14px;align-items:center}
.d-ph .d-av{width:50px;height:50px;font-size:1.05rem;background:rgba(255,255,255,.16)}
.d-ph b{display:block}.d-ph span{font-size:.75rem;opacity:.7;word-break:break-all}
.d-pd{padding:6px 22px}.d-pd div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:.8rem}
.d-pd div:last-child{border:0}.d-pd span{color:var(--mu)}.d-pd b{text-align:right;word-break:break-word}
.d-pf{padding:6px 22px 20px;display:grid;gap:8px}
.d-b{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;font-weight:700;font-size:.86rem;cursor:pointer;border:1px solid var(--bd);background:#fff;color:var(--ink);transition:.2s}
.d-b:hover{transform:translateY(-1px)}.d-b.p{background:var(--g8);color:#fff;border-color:var(--g8)}.d-b.w{background:#fff;color:var(--g8);border:0;box-shadow:0 8px 24px rgba(0,0,0,.2)}.d-b.r{color:#b63a3a}
main.d-w{max-width:1200px;margin:auto;padding:28px 24px 80px}
.d-hero{position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:38px 42px;border-radius:26px;color:#fff;background:linear-gradient(135deg,var(--g9),var(--g6))}
.d-hero:before,.d-hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.d-hero:before{width:340px;height:340px;right:-80px;top:-140px}.d-hero:after{width:200px;height:200px;right:200px;bottom:-120px}
.d-hero>*{position:relative;z-index:1}
.d-hero em{font-style:normal;font-size:.7rem;letter-spacing:.18em;font-weight:800;color:#a4e3b6}
.d-hero h1{font-size:2.3rem;letter-spacing:-.04em;line-height:1.1;margin:10px 0 8px}
.d-hero p{opacity:.8;font-size:.95rem;max-width:460px;line-height:1.5}
.d-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}
.d-c{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:24px;box-shadow:0 4px 18px rgba(13,43,27,.05)}
.d-s{position:relative;overflow:hidden;transition:.25s}.d-s:hover{transform:translateY(-3px);box-shadow:0 16px 36px rgba(13,43,27,.1)}
.d-i{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.25rem;margin-bottom:16px}
.d-s b{display:block;font-size:2.2rem;letter-spacing:-.04em;line-height:1}
.d-s span{display:block;margin-top:8px;font-size:.74rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mu)}
.d-s p{font-size:.8rem;color:var(--mu);margin-top:4px}
.d-g{display:grid;grid-template-columns:1.75fr 1fr;gap:20px;align-items:start}.d-col{display:grid;gap:20px}
.d-c h2{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:1.08rem;letter-spacing:-.02em;margin-bottom:18px}
.d-c h2 a{font-size:.8rem;font-weight:700;color:var(--g6)}
.d-trk h3{font-size:1.15rem;margin:2px 0 0}.d-trk small{color:var(--mu)}
.d-st{display:flex;margin:26px 0 8px}
.d-st div{flex:1;text-align:center;position:relative;font-size:.76rem;font-weight:700;color:#9aa69d}
.d-st div:before{content:"✓";display:grid;place-items:center;width:34px;height:34px;margin:0 auto 9px;border-radius:50%;background:#edf1ee;color:#fff;position:relative;z-index:1;font-size:.8rem}
.d-st div:after{content:"";position:absolute;top:16px;left:calc(50% + 17px);right:calc(-50% + 17px);height:3px;background:#e3e9e4}
.d-st div:last-child:after{display:none}
.d-st .on{color:var(--g6)}.d-st .on:before{background:var(--g5);box-shadow:0 0 0 5px rgba(45,138,77,.15)}.d-st .on:after{background:var(--g5)}
.d-tabs{display:flex;gap:6px;margin-bottom:14px}
.d-tabs button{padding:7px 15px;border-radius:99px;border:0;background:#eef2ef;font-size:.78rem;font-weight:700;color:var(--mu);cursor:pointer}
.d-tabs .on{background:var(--g8);color:#fff}
.d-r{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;cursor:pointer;transition:.15s}
.d-r:hover{background:#f5f8f5}.d-r+.d-r{border-top:1px solid var(--bd)}
.d-ri{width:42px;height:42px;border-radius:12px;background:var(--g1);display:grid;place-items:center;flex:none}
.d-rm{flex:1;min-width:0}.d-rm b{font-size:.9rem}.d-rm div{font-size:.78rem;color:var(--mu);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-p{padding:5px 12px;border-radius:99px;font-size:.72rem;font-weight:700;white-space:nowrap;background:#eef1ef;color:#536158}
.s-Pending{background:#fff3d6;color:#9a6a00}.s-Assigned{background:#e3eeff;color:#2455a6}.s-In-Progress{background:#efe5ff;color:#6a3db8}.s-Completed{background:var(--g1);color:#18532f}.s-Cancelled{background:#fde8e8;color:#b63a3a}
.d-e{text-align:center;padding:34px 12px;color:var(--mu);font-size:.9rem;line-height:1.7}.d-e .d-b{margin-top:14px}
.d-dn{display:flex;align-items:center;gap:22px}.d-lg{flex:1;display:grid;gap:10px;font-size:.82rem}
.d-lg div{display:flex;justify-content:space-between}.d-lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:9px}
.d-up{background:linear-gradient(160deg,#f3faf4,#fff)}.d-up b.t{display:block;font-size:1.4rem;letter-spacing:-.03em;margin:12px 0 10px}
.d-up p{font-size:.84rem;color:var(--mu);margin-top:6px}
.d-act{list-style:none;display:grid;gap:0;padding:0;margin:0}
.d-act li{display:flex;gap:14px;font-size:.84rem;padding-bottom:18px;position:relative}
.d-act li:before{content:"";flex:none;width:11px;height:11px;margin-top:4px;border-radius:50%;background:var(--g4);box-shadow:0 0 0 4px var(--g1);z-index:1}
.d-act li:after{content:"";position:absolute;left:5px;top:16px;bottom:0;width:1px;background:var(--bd)}.d-act li:last-child:after{display:none}
.d-act small{display:block;color:var(--mu);font-size:.74rem;margin-top:2px}
dialog.d-dl{margin:auto;border:0;border-radius:22px;padding:0;width:min(500px,92vw);box-shadow:0 30px 80px rgba(13,43,27,.3)}dialog::backdrop{background:rgba(13,43,27,.5)}
.d-dl>div{padding:28px}.d-kv div{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--bd);font-size:.85rem}.d-kv span{color:var(--mu)}.d-kv b{text-align:right}
@media(max-width:980px){.d-g{grid-template-columns:1fr}.d-stats{grid-template-columns:1fr 1fr}.d-links{display:none}.d-hero{flex-direction:column;align-items:flex-start}}
@media(max-width:520px){.d-stats{grid-template-columns:1fr}.d-nm{display:none}.d-hero{padding:28px 24px}.d-hero h1{font-size:1.7rem}.d-dn{flex-direction:column}}
</style>
    <link rel="icon" type="image/svg+xml" href="brand-mark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="brand.css">
</head>
<body class="d">
<header class="d-nav"><div>
  <a href="index.html" class="logo"><span class="brand"><img src="brand-mark.svg" alt="" width="38" height="38"><span class="brand-word"><b>E</b>-arth<i>chakra</i></span></span></a>
  <nav class="d-links"><a href="index.html">Home</a><a href="solutions.html">Solutions</a><a href="pricing.html">Pricing</a><a href="contact.html">Contact</a></nav>
  <div class="d-me">
    <button id="meBtn"><span class="d-av" id="av1">··</span><span class="d-nm" id="nm1">…</span><span style="color:var(--mu);font-size:.7rem">▾</span></button>
    <div class="d-pop" id="pop">
      <div class="d-ph"><span class="d-av" id="av2"></span><div><b id="pn"></b><span id="pe"></span></div></div>
      <div class="d-pd" id="pd"></div>
      <div class="d-pf"><a class="d-b p" href="pickup.html">+ Request a pickup</a><button class="d-b r" id="out">Sign out</button></div>
    </div>
  </div>
</div></header>

<main class="d-w">
  <section class="d-hero">
    <div><em>BUSINESS DASHBOARD</em><h1 id="hi">Welcome back!</h1><p id="sub"></p></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="d-b w" href="pickup.html">+ Request New Pickup</a><a class="d-b w" href="report.html">📷 Report Scrap / Waste</a></div>
  </section>
  <section class="d-stats" id="stats"></section>
  <section class="d-g">
    <div class="d-col">
      <div class="d-c d-trk" id="trk" hidden></div>
      <div class="d-c"><h2>Your Pickup Requests <a href="pickup.html">New request →</a></h2>
        <div class="d-tabs" id="tabs"><button class="on" data-f="all">All</button><button data-f="active">Active</button><button data-f="done">Completed</button></div>
        <div id="list"></div></div>
      <div class="d-c"><h2>Recent Activity</h2><ul class="d-act" id="act"></ul></div>
    </div>
    <div class="d-col">
      <div class="d-c d-up"><h2>Upcoming Pickup</h2><div id="up"></div></div>
      <div class="d-c"><h2>Waste Distribution</h2><div class="d-dn" id="dn"></div></div>
    </div>
  </section>
</main>
<dialog class="d-dl" id="dlg"><div id="dlgB"></div></dialog>

<script src="api.js"></script>
<script>
const $ = (i) => document.getElementById(i);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (d) => d ? new Date(d).toLocaleDateString("en-IN", {day:"numeric", month:"short", year:"numeric"}) : "—";
const STEPS = ["Pending", "Assigned", "In Progress", "Completed"], ACTIVE = STEPS.slice(0, 3);
const COL = ["#123b25", "#21713d", "#4caf68", "#8fd6a2", "#c9e8d1", "#6b8f75"];
const ICON = {Plastic:"♻️", Paper:"📄", Cardboard:"📦", Metal:"🔩", "E-waste":"🔌", Glass:"🍾", Organic:"🌿"};
const pill = (s) => `<span class="d-p s-${esc(s).replace(" ", "-")}">${esc(s)}</span>`;
const waste = (r) => Array.isArray(r.waste) ? r.waste : [];
let me = null; try { me = JSON.parse(localStorage.getItem("earthchakra_user") || "null"); } catch (e) {}
if (!me || !me.loggedIn) location.replace("login.html");
else if (me.role === "admin") location.replace("admin.html");
else if (me.role === "partner") location.replace("partner.html");

function paintUser(u) {
  const ini = (u.name || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
  $("av1").textContent = $("av2").textContent = ini;
  $("nm1").innerHTML = `${esc(u.name)}<small>${esc(u.businessName || "My account")}</small>`;
  $("pn").textContent = u.name; $("pe").textContent = u.email;
  $("pd").innerHTML = [["Business", u.businessName], ["Type", u.businessType], ["City", u.city], ["Phone", u.phone], ["Email", u.email], ["Account", "Customer"], ["Member since", fmt(u.createdAt)]]
    .map(([k, v]) => `<div><span>${k}</span><b>${esc(v || "—")}</b></div>`).join("");
  const h = new Date().getHours();
  $("hi").textContent = `${h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening"}, ${(u.name || "").split(" ")[0]}!`;
  $("sub").textContent = u.businessName ? `Here's what's happening with ${u.businessName}'s waste pickups today.` : "Here's an overview of your waste pickups.";
}
paintUser(me || {});
$("meBtn").onclick = (e) => { e.stopPropagation(); $("pop").classList.toggle("open"); };
document.addEventListener("click", (e) => { if (!$("pop").contains(e.target)) $("pop").classList.remove("open"); });
$("out").onclick = () => { EcoAPI.logout(); location.href = "index.html"; };
EcoAPI.call("/auth/me").then(({user}) => { localStorage.setItem("earthchakra_user", JSON.stringify(user)); paintUser(user); }).catch(() => {});
EcoAPI.loadRequests().then(render).catch((e) => { $("list").innerHTML = `<div class="d-e">${esc(e.message)}</div>`; });

function render(all) {
  const act = all.filter((r) => ACTIVE.includes(r.status)), done = all.filter((r) => r.status === "Completed");
  const today = new Date().toISOString().slice(0, 10);
  const next = all.filter((r) => r.scheduledDate >= today && ACTIVE.includes(r.status)).sort((a, b) => a.scheduledDate.localeCompare(b.scheduledDate))[0];
  const S = [["🚛", "#e7f3e9", all.length, "Total pickups", "All requests so far"], ["⏳", "#fff3d6", act.length, "Active", "In the pipeline right now"],
    ["✅", "#dff3e4", done.length, "Completed", "Collected successfully"], ["📅", "#e3eeff", next ? fmt(next.scheduledDate).replace(/ \d{4}$/, "") : "—", "Next pickup", next ? (next.scheduledTime || "Time to be confirmed") : "Nothing scheduled"]];
  $("stats").innerHTML = S.map(([i, bg, n, l, p]) => `<div class="d-c d-s"><div class="d-i" style="background:${bg}">${i}</div><b>${esc(n)}</b><span>${l}</span><p>${esc(p)}</p></div>`).join("");

  const cur = act.slice().sort((a, b) => STEPS.indexOf(b.status) - STEPS.indexOf(a.status))[0];
  $("trk").hidden = !cur;
  if (cur) $("trk").innerHTML = `<h2>Track your pickup ${pill(cur.status)}</h2><h3>${esc(cur.id)}</h3><small>${esc(waste(cur).join(", "))} · ${esc(cur.quantity)}</small>
    <div class="d-st">${STEPS.map((s, i) => `<div class="${i <= STEPS.indexOf(cur.status) ? "on" : ""}">${s}</div>`).join("")}</div>`;

  const draw = (f) => {
    const rows = all.filter((r) => f === "all" || (f === "active" ? ACTIVE.includes(r.status) : r.status === "Completed")).slice(0, 8);
    $("list").innerHTML = rows.length ? rows.map((r) => `<div class="d-r" data-id="${esc(r.id)}"><div class="d-ri">${ICON[waste(r)[0]] || "♻️"}</div>
      <div class="d-rm"><b>${esc(r.id)}</b><div>${esc(waste(r).join(", "))} · ${esc(r.quantity)} · ${fmt(r.createdAt)}</div></div>${pill(r.status)}</div>`).join("")
      : `<div class="d-e">${all.length ? "Nothing here yet." : "🌱 No pickups yet.<br>Request your first collection in under a minute.<br><a class='d-b p' href='pickup.html'>Request a pickup</a>"}</div>`;
    document.querySelectorAll(".d-r").forEach((el) => el.onclick = () => openReq(all.find((r) => r.id === el.dataset.id)));
  };
  draw("all");
  document.querySelectorAll("#tabs button").forEach((b) => b.onclick = () => { document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("on", x === b)); draw(b.dataset.f); });

  $("up").innerHTML = next ? `${pill(next.status)}<b class="t">${fmt(next.scheduledDate)}${next.scheduledTime ? " · " + esc(next.scheduledTime) : ""}</b><p>🚛 ${esc(next.partner || "Partner to be assigned")}</p><p>📍 ${esc(next.city || "Your business address")}</p>`
    : `<b class="t">No pickup scheduled</b><p>When our team schedules a collection, the date, time and partner appear here.</p><a class="d-b p" style="margin-top:16px" href="pickup.html">Request a pickup</a>`;

  const cnt = {}; all.forEach((r) => waste(r).forEach((w) => cnt[w] = (cnt[w] || 0) + 1));
  const ent = Object.entries(cnt).sort((a, b) => b[1] - a[1]), tot = ent.reduce((s, e) => s + e[1], 0);
  if (!tot) $("dn").innerHTML = `<div class="d-e" style="width:100%;padding:10px">Your waste mix will appear here.</div>`;
  else { let o = 0; const C = 2 * Math.PI * 42;
    const arcs = ent.map(([, v], i) => { const l = v / tot * C, s = `<circle r="42" cx="65" cy="65" fill="none" stroke="${COL[i % 6]}" stroke-width="18" stroke-dasharray="${l - 2} ${C - l + 2}" stroke-dashoffset="${-o}" transform="rotate(-90 65 65)"/>`; o += l; return s; }).join("");
    $("dn").innerHTML = `<svg width="130" height="130" viewBox="0 0 130 130">${arcs}<text x="65" y="64" text-anchor="middle" font-size="22" font-weight="800" fill="#142018">${all.length}</text><text x="65" y="80" text-anchor="middle" font-size="9" fill="#6b786f">requests</text></svg>
      <div class="d-lg">${ent.slice(0, 6).map(([k, v], i) => `<div><span><i style="background:${COL[i % 6]}"></i>${esc(k)}</span><b>${Math.round(v / tot * 100)}%</b></div>`).join("")}</div>`; }

  const vb = {Pending: "submitted", Assigned: "assigned to a partner", "In Progress": "is being collected", Completed: "was completed", Cancelled: "was cancelled"};
  const rec = all.slice().sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt)).slice(0, 5);
  $("act").innerHTML = rec.length ? rec.map((r) => `<li><div>Request <b>${esc(r.id)}</b> ${vb[r.status] || "updated"}<small>${fmt(r.updatedAt)}</small></div></li>`).join("") : `<li><div>No activity yet.</div></li>`;
}

function openReq(r) {
  if (!r) return;
  $("dlgB").innerHTML = `<h3 style="font-size:1.25rem;margin-bottom:8px">${esc(r.id)}</h3>${pill(r.status)}
    <div class="d-kv" style="margin-top:18px"><div><span>Waste</span><b>${esc(waste(r).join(", "))}</b></div><div><span>Quantity</span><b>${esc(r.quantity)}</b></div><div><span>Frequency</span><b>${esc(r.frequency)}</b></div>
    <div><span>Requested</span><b>${fmt(r.createdAt)}</b></div><div><span>Scheduled</span><b>${r.scheduledDate ? fmt(r.scheduledDate) + (r.scheduledTime ? " · " + esc(r.scheduledTime) : "") : "Not yet"}</b></div>
    <div><span>Partner</span><b>${esc(r.partner || "Not yet assigned")}</b></div>${r.message ? `<div><span>Notes</span><b>${esc(r.message)}</b></div>` : ""}</div>
    <button class="d-b" style="width:100%;margin-top:20px" onclick="dlg.close()">Close</button>`;
  $("dlg").showModal();
}
$("dlg").addEventListener("click", (e) => { if (e.target === $("dlg")) $("dlg").close(); });
</script>
</body>
</html>
